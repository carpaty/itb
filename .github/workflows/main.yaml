name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare example configs
        run: |
          cp src/calls/button_func.py.example src/calls/button_func.py
          cp src/menu.yaml.example src/menu.yaml

      - name: Analysing the code with pylint
        run: pylint $(git ls-files '*.py' '*.py.example')

      - name: Checking code style
        run: pycodestyle --count --max-line-length=120 $(git ls-files '*.py' '*.py.example')

      - name: Running tests
        run: pytest

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-appengine
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Copy files
        run: |
          cp src/calls/button_func.py.example src/calls/button_func.py
          cp src/menu.yaml.example src/menu.yaml
          cp app.yaml.example app.yaml

      - id: auth
        name: Register gcloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - id: deploy
        name: Deploying
        uses: google-github-actions/deploy-appengine@v3
        with:
          project_id: infratrix
          env_vars: |-
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_WEBHOOK_URL=${{ secrets.TELEGRAM_WEBHOOK_URL }}

      - id: test
        name: Testing release
        env:
          VERSION_URL: ${{ steps.deploy.outputs.version_url }}
        run: curl --fail --silent --show-error --retry 3 "$VERSION_URL/healthcheck"
